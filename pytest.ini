# Pipeline unit tests.
#
# The suite is stdlib unittest run under pytest — matching tests/test_storage.py,
# which predates this config. Nothing here reaches Snowflake, GCS, Tor or
# Selenium: fakes are injected at the call site instead, so `pytest` is safe to
# run on any machine and in CI without credentials.

[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers
