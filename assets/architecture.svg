  .sans { font-family:"DM Sans","Inter","Segoe UI",Helvetica,Arial,sans-serif }
  .hflow, .vflow { stroke-dasharray:5 5; animation:fl 1.6s linear infinite }
  .vflow { stroke-dasharray:3 4; animation-duration:2.2s }
  @keyframes fl { from { stroke-dashoffset:20 } to { stroke-dashoffset:0 } }
  .boundary { stroke-dasharray:6 6; animation:bd 5s linear infinite }
  @keyframes bd { from { stroke-dashoffset:24 } to { stroke-dashoffset:0 } }
  @media (prefers-reduced-motion:reduce) {
    .hflow,.vflow,.boundary { animation:none; stroke-dasharray:none }
    circle[filter] { display:none }
  }
</style>
