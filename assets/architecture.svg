<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1624 520" width="1624" height="520" role="img" aria-label="Nocturne architecture: collect, land, cascade, score, serve — with AI stages marked as cached and gated">
<title>Nocturne architecture — five stages, ORG_ID scoped end to end</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#070D19"/><stop offset="50%" stop-color="#04070E"/><stop offset="100%" stop-color="#02040A"/></linearGradient>
  <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#4C8DFF"/></marker>
  <filter id="g" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#4C8DFF" opacity=".10"/></pattern>
  <clipPath id="fr"><rect width="1624" height="520" rx="14"/></clipPath>
</defs>
<style>
