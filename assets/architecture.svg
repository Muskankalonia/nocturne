oke-width="1.2"/><text class="mono" x="812.0" y="204" text-anchor="middle" fill="#E8EEFA" font-size="11">L1 · AI_CLASSIFY</text></g><g><rect x="694" y="247" width="236" height="38" rx="8" fill="#8B3FD9" fill-opacity=".12" stroke="#8B3FD9" stroke-opacity=".65" stroke-width="1.2"/><text class="mono" x="812.0" y="270" text-anchor="middle" fill="#E8EEFA" font-size="11">L2 · AI_COMPLETE</text></g><g><rect x="694" y="313" width="236" height="38" rx="8" fill="#4C8DFF" fill-opacity=".12" stroke="#4C8DFF" stroke-opacity=".65" stroke-width="1.2"/><text class="mono" x="812.0" y="336" text-anchor="middle" fill="#E8EEFA" font-size="11">SQL grounding + routing</text></g><g><rect x="1018" y="115" width="236" height="38" rx="8" fill="#8B3FD9" fill-opacity=".12" stroke="#8B3FD9" stroke-opacity=".65" stroke-width="1.2"/><text class="mono" x="1136.0" y="138" text-anchor="middle" fill="#E8EEFA" font-size="11">Leak-type AI · multi-label</text></g><g><rect x="1018" y="181" width="236" height="38" rx="8" fill="#4C8DFF" fill-opacity=".12" stroke="#4C8DFF" stroke-opacity=".65" stroke-width="1.2"/><text class="mono" x="1136.0" y="204" text-anchor="middle" fill="#E8EEFA" font-size="11">L3 · knowledge graph</text></g><g><rect x="1018" y="247" width="236" height="38" rx="8" fill="#4C8DFF" fill-opacity=".12" stroke="#4C8DFF" stroke-opacity=".65" stroke-width="1.2"/><text class="mono" x="1136.0" y="270" text-anchor="middle" fill="#E8EEFA" font-size="11">L4 · impact / confidence / triage</text></g><g><rect x="1018" y="313" width="236" height="38" rx="8" fill="#8B3FD9" fill-opacity=".12" stroke="#8B3FD9" stroke-opacity=".65" stroke-width="1.2"/><text class="mono" x="1136.0" y="336" text-anchor="middle" fill="#E8EEFA" font-size="11">Incident insight AI</text></g><g><rect x="1342" y="163" width="236" height="38" rx="8" fill="#4C8DFF" fill-opacity=".12" stroke="#4C8DFF" stroke-opacity=".65" stroke-width="1.2"/><text class="mono" x="1460.0" y="186" text-anchor="middle" fill="#E8EEFA" font-size="11">13 