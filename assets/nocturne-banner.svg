  <linearGradient id="pfIntake" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4C8DFF" stop-opacity=".55"/><stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/></linearGradient>
