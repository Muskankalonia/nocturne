<style>
  .sans { font-family:"DM Sans","Inter","Segoe UI",Helvetica,Arial,sans-serif }
  .mono { font-family:"JetBrains Mono","Space Mono",Consolas,"SF Mono",Menlo,monospace }
  .cap  { font-family:"JetBrains Mono","Space Mono",Consolas,monospace; letter-spacing:.16em; text-transform:uppercase }
  .pf-strand { stroke-dasharray:6 14; animation:pfDash 3s linear infinite }
  @keyframes pfDash { to { stroke-dashoffset:-40 } }
  .pf-spin { animation:pfSpin 28s linear infinite; transform-origin:830px 268px }
  @keyframes pfSpin { to { transform:rotate(360deg) } }
  .drift { animation:drift 60s linear infinite }
  @keyframes drift { from { transform:translate(0,0) } to { transform:translate(34px,34px) } }
  .fA { animation:fA 30s ease-in-out infinite }
  @keyframes fA { 0%,100% { transform:translate(0,0) scale(1) } 50% { transform:translate(70px,40px) scale(1.12) } }
  .fB { animation:fB 38s ease-in-out infinite }
  @keyframes fB { 0%,100% { transform:translate(0,0) scale(1.05) } 50% { transform:translate(-50px,-30px) scale(.94) } }
  .arc { stroke-dasharray:900; animation:drawArc 3.2s cubic-bezier(.4,0,.2,1) forwards }
  @keyframes drawArc { from { stroke-dashoffset:900 } to { stroke-dashoffset:0 } }
  .breathe { animation:br 3.6s ease-in-out infinite }
  @keyframes br { 0%,100% { opacity:.7 } 50% { opacity:1 } }
  .rule { stroke-dasharray:300; animation:draw 2.4s cubic-bezier(.4,0,.2,1) forwards }
  @keyframes draw { from { stroke-dashoffset:300 } to { stroke-dashoffset:0 } }
  @media (prefers-reduced-motion:reduce) {
    .pf-strand,.pf-spin,.drift,.fA,.fB,.arc,.breathe,.rule { animation:none }
    .pf-strand { stroke-dasharray:none } .arc,.rule { stroke-dashoffset:0 }
  }
</style>
